# OYK Packet Node - Radio & Network Interface Configurations

[interface axudp0]
type = axudp
description = Primary AXUDP Link
bind_host = 0.0.0.0
bind_port = 10093
auto_learn = true
allow_inbound = true
allow_outbound = true
allow_same_interface = false
# Optional IPv4 netmask filter for axudp/axip (e.g. 255.0.0.0 for DMR 10.x.x.x)
# netmask = 255.0.0.0

# Additional radio interfaces can be defined with extra [interface <id>] sections:

# AXIP (IP Protocol 93 / RFC 1226) - requires root or CAP_NET_RAW
# [interface axip0]
# type = axip
# description = AXIP Backbone (IP Proto 93)
# bind_host = 0.0.0.0
# netmask = 255.255.255.0
# auto_learn = true
# allow_inbound = true
# allow_outbound = true

# KISS over Serial TNC (/dev/ttyUSB0, /dev/ttyACM0, Direwolf PTY, etc.)
# [interface kiss0]
# type = kiss-serial
# description = VHF 1200bps TNC
# device = /dev/ttyUSB0
# baud = 9600
# kiss_port = 0
# txdelay = 30
# persistence = 63
# slottime = 10
# allow_inbound = true
# allow_outbound = true

# KISS over TCP/IP (mode = client connects to Direwolf; mode = server listens)
# [interface direwolf0]
# type = kiss-tcp
# description = Direwolf KISS TCP
# mode = client
# host = 127.0.0.1
# port = 8001
# kiss_port = 0
# reconnect_ms = 3000
# allow_inbound = true
# allow_outbound = true

# Incoming Telnet Console (incoming-only for security)
# [interface telnet0]
# type = telnet
# description = Incoming Telnet Access
# bind_host = 0.0.0.0
# bind_port = 8010
# max_clients = 32
# allow_inbound = true
