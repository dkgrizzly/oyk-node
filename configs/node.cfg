# OYK Amateur Radio Packet Node Configuration
#
# Automatic search order when -c/--config is not specified:
#   1. ~/.oyk/node.cfg
#   2. /etc/oyk/node.cfg
#   3. ./node.cfg

[node]
# Base callsign or CALL-SSID (when SSID is omitted, default node SSID is 7)
callsign = N0CALL-7
alias = OYKNOD
welcome = Type HELP or ? for commands.
info = OYK C++ Modular Amateur Radio Packet Node
accept_incoming = true
paclen = 236
maxframe = 4
t1_ms = 3000
n2_retries = 5
idle_timeout_sec = 600
# Periodic AX.25 UI ID beacon interval in seconds (0 = disabled, 600 = 10 min)
beacon_interval_sec = 0

# Logging settings
# Severity bitmask flags:
#   0x00=SILENT, 0x01=ERROR, 0x02=WARNING, 0x04=INFO,
#   0x10=KICK, 0x20=BAN, 0x40=APPEAL, 0x80=DEBUG
logpath = logs/
# Console defaults to all messages except DEBUG (0x77)
consolelevel = 0x77
# Rotate log files daily (file.log -> file.log.YYYYMMDD)
log_rotate_daily = true

# Optional override for banlist.cfg path (defaults to banlist.cfg in the same directory as node.cfg)
# banlist = /etc/oyk/banlist.cfg

[logfiles]
# Files stored under logpath; values accept hex (0x..), binary (0b..), decimal, or names (ERROR|INFO|...)
# Default node.log logs ERROR, WARNING, INFO, KICK, BAN (0x37)
node.log = 0x37
# Appeals log receives sanitized callsign, timestamp, and <=140 char base-ASCII appeal text
appeals.log = 0x40
# Optional separate debug log:
# debug.log = 0x80

[bbs]
# Packet Bulletin Board System / PBBS (default SSID 11 -> N0CALL-11)
enabled = true
ssid = 11
# Optional explicit callsign override (defaults to <node base callsign>-<ssid>):
# callsign = N0CALL-11
alias = OYKBBS
mailpath = mail/
# Enable or disable the BBS downloadable/uploadable files area
files_enabled = true
# Case-insensitive file lookup on POSIX (exact -> UPPER -> lower -> glob)
files_case_insensitive = true
# Root directory for the BBS downloadable files area (sysop approves uploads from incoming/)
filespath = files/
welcome = Welcome to OYK Packet BBS! Type H for help, B to exit.
max_msg_bytes = 8192

[chat]
# Multi-user packet CHAT conference (default SSID 12 -> N0CALL-12)
enabled = true
ssid = 12
# Optional explicit callsign override (defaults to <node base callsign>-<ssid>):
# callsign = N0CALL-12
alias = OYKCHT
topic = Lobby
welcome = Welcome to OYK Packet Chat! Type /h for help, /q to leave.

[rig]
# Radio / rig control (Hamlib rigctld TCP or RadioFoundry/takRF UDP zone/channel control)
enabled = false
# Protocol: rigctl (TCP default port 4532) or radiofoundry (UDP default port 4191)
protocol = rigctl
host = 127.0.0.1
port = 4532
# Keepalive / poll interval in seconds (RadioFoundry requires <=60s to keep notifications active)
poll_interval_sec = 30
# Receive unsolicited RadioFoundry UDP 4191 change notifications
notify = true

[interface axudp0]
type = axudp
description = Primary AXUDP Link
bind_host = 0.0.0.0
bind_port = 10093
auto_learn = true
# Static peers (format: CALLSIGN@host:port, CALLSIGN host:port, or host:port for broadcast)
# peer = W1AW-7@192.168.1.50:10093
# peer = 127.0.0.1:10094

# Additional radio interfaces can be defined with extra [interface <id>] sections:

# AXIP (IP Protocol 93 / RFC 1226) - requires root or CAP_NET_RAW
# [interface axip0]
# type = axip
# description = AXIP Backbone (IP Proto 93)
# bind_host = 0.0.0.0
# auto_learn = true
# peer = W1AW-7@198.51.100.10

# KISS over Serial TNC (/dev/ttyUSB0, /dev/ttyACM0, Direwolf PTY, etc.)
# [interface kiss0]
# type = kiss-serial
# description = VHF 1200bps TNC
# device = /dev/ttyUSB0
# baud = 9600
# kiss_port = 0
# txdelay = 30
# persistence = 63
# slottime = 10

# KISS over TCP/IP (mode = client connects to Direwolf; mode = server listens)
# [interface direwolf0]
# type = kiss-tcp
# description = Direwolf KISS TCP
# mode = client
# host = 127.0.0.1
# port = 8001
# kiss_port = 0
# reconnect_ms = 3000

# Incoming Telnet Console (incoming-only for now)
# [interface telnet0]
# type = telnet
# description = Incoming Telnet Access
# bind_host = 0.0.0.0
# bind_port = 8010
# max_clients = 32
