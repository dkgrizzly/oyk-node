# OYK-Node Custom Themes (included via `themes = themes.cfg` in node.cfg [node])
# Built-in `dark`, `light`, and `native` palettes never need sections here.

[theme amber-crt]
bg = #120B00
fg = #FFB000
panel_bg = #1C1202
panel_fg = #FFB000
border = #D97706
header_bg = #78350F
header_fg = #FEF3C7
accent = #FBBF24
status_bg = #1C1202
status_fg = #FDE68A
selection_bg = #B45309
selection_fg = #FFFBEB
input_bg = #0E0800
input_fg = #FDE68A
button_bg = #451A03
button_fg = #FEF3C7
ok = #84CC16
warn = #FBBF24
error = #F87171
