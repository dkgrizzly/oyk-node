name: Linux CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++ libncurses-dev libgtk2.0-dev pkg-config python3
      - name: Run oyk-node CI gate
        run: ./scripts/ci.sh --quick
