# Example configuration for Raspberry Pi Pico W / Pico 2 W / Waveshare Core2350B / Pimoroni PGA2350

[node]
callsign = N0CALL-7
alias = OYKNOD
welcome = Welcome to OYK Packet Node (Pico RP2040/RP2350)
info = OYK Amateur Radio Packet Node (Pico + RM2 / CYW43)
interfaces = interfaces.cfg
peers = peers.cfg
themes = themes.cfg
theme = dark
banlist = banlist.cfg

[bbs]
enabled = true
ssid = 11
alias = OYKBBS
mailpath = mail/
filespath = files/

[chat]
enabled = true
ssid = 12
alias = OYKCHT
topic = Lobby

[interface wifi0]
type = axudp
description = CYW43/RM2 Wi-Fi AXUDP
bind_host = 0.0.0.0
bind_port = 10093
netmask = 255.255.255.0
allow_inbound = true
allow_outbound = true
allow_same_interface = true

[interface ppp0]
type = ppp
description = RadioFoundry PPP (ser0 / UART0 TX0 RX1 CTS2 RTS3)
device = ser0
bind_host = 10.44.0.1
bind_port = 10093
baud = 115200
allow_inbound = true
allow_outbound = true

[interface kiss0]
type = kiss-serial
description = VHF KISS TNC (ser1 / UART1 TX4 RX5 CTS6 RTS7)
device = ser1
baud = 9600
allow_inbound = true
allow_outbound = true

[interface bt0]
type = kiss-bt
description = CYW43/RM2 Bluetooth Classic SPP & BLE KISS
allow_inbound = true
allow_outbound = true
