# Example configuration for Luckfox Lyra (RK3506G2 / RK3506B, RT-Thread SMP)
# and ClockworkPi PicoCalc + Luckfox Lyra drop-in replacement builds.

[node]
callsign = N0CALL-7
alias = OYKNOD
welcome = Welcome to OYK Packet Node (Luckfox Lyra RK3506)
info = OYK Amateur Radio Packet Node (Luckfox Lyra RT-Thread SMP)
interfaces = interfaces.cfg
peers = peers.cfg
themes = themes.cfg
theme = dark
banlist = banlist.cfg

[bbs]
enabled = true
ssid = 11
alias = OYKBBS
mailpath = mail/
filespath = files/

[chat]
enabled = true
ssid = 12
alias = OYKCHT
topic = Lobby

[interface eth0]
type = axudp
description = RK3506 lwIP/SAL AXUDP (RMII / Wi-Fi / RNDIS)
bind_host = 0.0.0.0
bind_port = 10093
netmask = 255.255.255.0
allow_inbound = true
allow_outbound = true
allow_same_interface = true

[interface ppp0]
type = ppp
description = RadioFoundry PPP (ser0 / uart1)
device = ser0
bind_host = 10.44.0.1
bind_port = 10093
baud = 115200
allow_inbound = true
allow_outbound = true

[interface kiss0]
type = kiss-serial
description = VHF KISS TNC (ser1 / uart2, standalone only)
device = ser1
baud = 9600
allow_inbound = true
allow_outbound = true
