# OYK Amateur Radio Packet Node Configuration for Teensy 4.1 / IMXRT1060 (TinyTMUX)
# Place on the Teensy 4.1 onboard microSD card as /node.cfg

[node]
# Base callsign or CALL-SSID (default SSID is 7 if omitted)
callsign = N0CALL-7
alias = OYKNOD
info = OYK Packet Node (Teensy 4.1 / TinyTMUX IMXRT1060)
accept_incoming = true
logpath = logs/
consolelevel = 0x77
log_rotate_daily = true

[logfiles]
node.log = 0x37
appeals.log = 0x40

[bbs]
# Packet BBS on SSID 11 (N0CALL-11) with sandboxed files area on microSD
enabled = true
ssid = 11
alias = OYKBBS
mailpath = mail/
filespath = files/
welcome = Welcome to OYK Packet BBS (TinyTMUX)! Type H for help, B to exit.
max_msg_bytes = 2048

[chat]
# Multi-user Packet CHAT on SSID 12 (N0CALL-12)
enabled = true
ssid = 12
alias = OYKCHT
topic = Lobby
welcome = Welcome to OYK Packet Chat! Type /h for help, /q to leave.

# 10/100 Ethernet Jack (IMXRT1060 ENET + DP83825I RMII PHY): AXUDP
[interface enet0]
type = axudp
description = 10/100 Ethernet AXUDP
bind_host = 0.0.0.0
bind_port = 10093
# peer = W1AW-7@192.168.1.50:10093

# 10/100 Ethernet Jack: AXIP (IP Protocol 93 / RFC 1226)
[interface axip0]
type = axip
description = 10/100 Ethernet AXIP
bind_host = 0.0.0.0
# peer = W1AW-7@198.51.100.10

# RadioFoundry Firmware Radio over PPP on ser0 (LPUART6: RX=0, TX=1, CTS=33, RTS=6)
# Carries BOTH AXUDP (UDP) and AXIP (IP Proto 93) over RFC 1661/1662/1332 PPP!
[interface ppp0]
type = ppp
description = RadioFoundry PPP Radio (ser0)
device = ser0
baud = 115200
bind_host = 10.44.0.1
bind_port = 10093
peer = RF0RAD@10.44.0.2:10093

# Optional KISS Serial TNC on ser1 (LPUART4: RX=7, TX=8, CTS=2, RTS=9)
[interface kiss0]
type = kiss-serial
description = VHF KISS TNC (ser1)
device = ser1
baud = 9600
kiss_port = 0
