# Example configuration for ESP32-C6 (M5Stack Unit C6L)

[node]
callsign = N0CALL-7
alias = OYKNOD
welcome = Welcome to OYK Packet Node (ESP32-C6 M5Stack Unit C6L)
info = OYK Amateur Radio Packet Node (ESP32-C6 + SX1262 LoRa)
interfaces = interfaces.cfg
peers = peers.cfg
themes = themes.cfg
theme = dark
banlist = banlist.cfg

[bbs]
enabled = true
ssid = 11
alias = OYKBBS
mailpath = mail/
filespath = files/

[chat]
enabled = true
ssid = 12
alias = OYKCHT
topic = Lobby

[interface lora0]
type = kiss-serial
description = SX1262 LoRa AX.25/KISS Radio (SPI2 + PI4IO)
device = lora0
baud = 9600
allow_inbound = true
allow_outbound = true
allow_same_interface = true

[interface wifi0]
type = axudp
description = ESP32-C6 Wi-Fi 6 AXUDP
bind_host = 0.0.0.0
bind_port = 10093
netmask = 255.255.255.0
allow_inbound = true
allow_outbound = true
allow_same_interface = true

[interface ppp0]
type = ppp
description = Grove Port A PPP (ser0: TX5 RX4)
device = ser0
bind_host = 10.44.0.1
bind_port = 10093
baud = 115200
allow_inbound = true
allow_outbound = true

[interface bt0]
type = kiss-bt
description = ESP32-C6 BLE 5 KISS Service
allow_inbound = true
allow_outbound = true
